name: Backup diário do Supabase

on:
  schedule:
    # 06:00 UTC = 03:00 horário de Brasília
    - cron: '0 6 * * *'
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar dados do Supabase
        run: node scripts/backup-supabase.js

      - name: Commitar backup (se houver mudanças)
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup automático $(date +%Y-%m-%d)"
          git push
