<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestão de Obras - Diário de Bordo, Cronograma e Materiais">
  <title>Gestão de Obras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/obras.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="js/pin-gate.js"></script>
</head>
<body>

<div class="container-obras">
  <!-- NAV ENTRE MÓDULOS -->
  <div class="nav-modulos">
    <a href="index.html" class="nav-modulo-btn">📋 Serviços</a>
    <a href="obras.html" class="nav-modulo-btn nav-modulo-ativo">🏗️ Obras</a>
  </div>

  <!-- HEADER COM NAV -->
  <div class="header-obras">
    <div class="header-titulo">
      <h1>🏗️ Gestão de Obras</h1>
      <p>Diário de Bordo, Cronograma e Materiais</p>
    </div>
    <button id="btn-nova-obra" class="btn btn-prim">➕ Nova Obra</button>
  </div>

  <!-- BUSCA E FILTROS -->
  <div class="toolbar-obras">
    <input type="text" id="busca-obras" placeholder="🔍 Buscar por nome, cliente ou endereço...">
    <div class="filtros-obras">
      <button class="filtro-obra-btn ativo" data-filtro="todas">Todas</button>
      <button class="filtro-obra-btn" data-filtro="Planejamento">Planejamento</button>
      <button class="filtro-obra-btn" data-filtro="Em Andamento">Em Andamento</button>
      <button class="filtro-obra-btn" data-filtro="Concluída">Concluída</button>
      <button class="filtro-obra-btn" data-filtro="Pausada">Pausada</button>
    </div>
  </div>

  <!-- LISTAGEM DE OBRAS (INICIAL) -->
  <div id="lista-obras-container" class="lista-obras-container">
    <div class="loading">Carregando obras...</div>
  </div>

  <!-- GALERIA DE OBRAS (ALTERNATIVA) -->
  <div id="galeria-obras-container" class="galeria-obras-container" style="display: none;"></div>

  <!-- PAINEL DE OBRA (ABERTO) -->
  <div id="painel-obra-container" class="painel-obra-container" style="display: none;">
    <div class="painel-header">
      <button id="btn-voltar-obras" class="btn-voltar">← Voltar</button>
      <div class="painel-titulo">
        <h2 id="painel-nome-obra"></h2>
        <p id="painel-endereco-obra"></p>
      </div>
      <div class="painel-status">
        <button id="btn-portal-cliente" class="btn btn-pequeno">🔗 Portal do Cliente</button>
        <span id="painel-status-badge" class="status-badge"></span>
      </div>
    </div>

    <!-- ABAS DE CONTEÚDO -->
    <div class="abas-obra">
      <button class="aba-btn aba-ativa" data-aba="diario">📖 Diário</button>
      <button class="aba-btn" data-aba="cronograma">📅 Etapas</button>
      <button class="aba-btn" data-aba="atividades">✓ Atividades</button>
      <button class="aba-btn" data-aba="materiais">📦 Materiais</button>
      <button class="aba-btn" data-aba="revisao">🔍 Revisão</button>
      <button class="aba-btn" data-aba="resumo">📊 Resumo</button>
    </div>

    <!-- CONTEÚDO DAS ABAS -->
    <div class="abas-conteudo">
      <!-- ABA: DIÁRIO DE BORDO -->
      <div id="aba-diario" class="aba-conteudo aba-ativa">
        <div class="secao-header">
          <h3>📖 Diário de Bordo</h3>
          <div class="secao-header-botoes">
            <button id="btn-exportar-diario" class="btn btn-pequeno">📄 Exportar PDF</button>
            <button id="btn-nova-anotacao" class="btn btn-pequeno btn-prim">➕ Novo Registro</button>
          </div>
        </div>
        <div id="diario-lista" class="diario-lista"></div>
      </div>

      <!-- ABA: ETAPAS -->
      <div id="aba-cronograma" class="aba-conteudo">
        <div class="secao-header">
          <h3>📅 Etapas da Obra</h3>
        </div>
        <div id="cronograma-lista" class="cronograma-lista"></div>
      </div>

      <!-- ABA: ATIVIDADES -->
      <div id="aba-atividades" class="aba-conteudo">
        <div class="secao-header">
          <h3>✓ Atividades</h3>
          <button id="btn-nova-atividade" class="btn btn-pequeno">➕ Nova Atividade</button>
        </div>
        <div id="atividades-lista" class="atividades-lista"></div>
      </div>

      <!-- ABA: MATERIAIS -->
      <div id="aba-materiais" class="aba-conteudo">
        <div class="secao-header">
          <h3>📦 Materiais</h3>
          <button id="btn-novo-material" class="btn btn-pequeno">➕ Novo Material</button>
        </div>
        <div id="materiais-lista" class="materiais-lista"></div>
      </div>

      <!-- ABA: REVISÃO FINAL -->
      <div id="aba-revisao" class="aba-conteudo">
        <div class="secao-header">
          <h3>🔍 Revisão Final</h3>
        </div>
        <p class="revisao-explicacao">Observações da arquiteta ou do cliente para correção antes da entrega da obra.</p>
        <div id="revisao-lista" class="cronograma-lista"></div>
      </div>

      <!-- ABA: RESUMO -->
      <div id="aba-resumo" class="aba-conteudo">
        <div id="resumo-conteudo"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DE FORMULÁRIO -->
<div id="form-modal-obras"></div>

<!-- SCRIPTS -->
<script src="js/supabase-config.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/store-obras.js"></script>
<script src="js/app-obras.js"></script>
<script src="js/pwa-register.js"></script>

</body>
</html>
